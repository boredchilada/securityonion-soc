<v-container fluid data-aid="agentstudio_screen">
  <!-- Options dialog -->
  <v-dialog v-model="showOptionsDialog" max-width="540">
    <v-card class="options-dialog">
      <v-card-title role="heading" aria-level="2">{{ i18n.options }}</v-card-title>
      <v-card-text data-aid="agentstudio_options">
        <v-row class="px-2">
          <v-col cols="6">
            <v-text-field v-model.number="maxDelegationDepth" type="number" min="0" :label="i18n.agentStudioMaxDepth" prepend-inner-icon="fa-layer-group" hide-details></v-text-field>
          </v-col>
          <v-col cols="6">
            <v-text-field v-model.number="maxSubSessionTokens" type="number" min="0" :label="i18n.agentStudioMaxSubTokens" prepend-inner-icon="fa-coins" hide-details></v-text-field>
          </v-col>
        </v-row>
        <div class="text-body-small mt-3" v-text="i18n.agentStudioOptionsHelp"></div>
      </v-card-text>
      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn variant="text" @click="showOptionsDialog = false">{{ i18n.cancel }}</v-btn>
        <v-btn variant="flat" color="primary" :loading="savingOptions" :disabled="!optionsDirty()" @click="persistOptions()" data-aid="agentstudio_options_save">{{ i18n.save }}</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>

  <!-- Create agent dialog -->
  <v-dialog v-model="createDialog" persistent width="900px" scrollable data-aid="agentstudio_create_dialog">
    <v-card class="agentstudio-dialog">
      <v-card-title class="py-4 title" role="heading" aria-level="2">
        <v-icon class="mr-2">fa-robot</v-icon>{{ i18n.agentStudioNewAgent }}
      </v-card-title>
      <v-divider></v-divider>
      <v-card-text style="max-height: 70vh;">
        <v-row>
          <v-col cols="12" md="6">
            <v-text-field v-model="newAgent.name" :label="i18n.agentStudioName" variant="outlined" density="comfortable" autofocus hide-details></v-text-field>
          </v-col>
          <v-col cols="12" md="6">
            <v-select v-model="newAgent.isOrchestrator" :items="roleItems" :label="i18n.agentStudioRole" variant="outlined" density="comfortable" hide-details></v-select>
          </v-col>
          <v-col cols="12" md="6">
            <v-select v-model="newAgent.model" :items="models.map(m => m.displayName)" :label="i18n.agentStudioExecutingModel" variant="outlined" density="comfortable" hide-details></v-select>
          </v-col>
          <v-col cols="12">
            <v-select v-model="newAgent.allowedSkills" :items="skills.map(s => s.name)" :label="i18n.agentStudioSkills" variant="outlined" density="comfortable" multiple chips closable-chips :hint="i18n.agentStudioSkillsHelp" persistent-hint></v-select>
          </v-col>
          <v-col cols="12">
            <v-select v-model="newAgent.canDelegateTo" :items="delegateChoices(newAgent)" :label="i18n.agentStudioDelegatesTo" variant="outlined" density="comfortable" multiple chips closable-chips :hint="i18n.agentStudioDelegationHelp" persistent-hint></v-select>
          </v-col>
          <v-col cols="12">
            <v-textarea v-model="newAgent.description" :label="i18n.agentStudioDescription" variant="outlined" density="comfortable" rows="2" auto-grow :hint="i18n.agentStudioDescriptionHelp" persistent-hint></v-textarea>
          </v-col>
          <v-col cols="12">
            <v-textarea v-model="newAgent.prompt" :label="i18n.agentStudioPersona" variant="outlined" density="comfortable" rows="8" auto-grow :hint="i18n.agentStudioPersonaHelp" persistent-hint></v-textarea>
          </v-col>
        </v-row>
      </v-card-text>
      <v-divider></v-divider>
      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn variant="text" @click="createDialog = false" data-aid="agentstudio_create_cancel">{{ i18n.cancel }}</v-btn>
        <v-btn variant="flat" color="primary" :loading="saving" :disabled="!newAgent.name" @click="saveNewAgent()" data-aid="agentstudio_create_confirm">{{ i18n.save }}</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>

  <v-row>
    <v-col>
      <!-- Tabs (left) + shortened action toolbar (right) -->
      <div class="d-flex align-center mb-2">
        <v-tabs v-model="tab" color="primary" class="flex-grow-0" data-aid="agentstudio_tabs">
          <v-tab value="agents" data-aid="agentstudio_agents_tab">
            <v-icon class="mr-2">fa-robot</v-icon>{{ i18n.agentStudioAgents }}
          </v-tab>
          <v-tab value="skills" data-aid="agentstudio_skills_tab">
            <v-icon class="mr-2">fa-puzzle-piece</v-icon>{{ i18n.agentStudioSkills }}
          </v-tab>
        </v-tabs>
        <v-spacer></v-spacer>
        <v-toolbar class="so-toolbar elevation-0 flex-grow-0" variant="flat" density="comfortable" style="width: fit-content;">
          <v-btn v-if="tab === 'agents'" icon variant="flat" class="circle-button mx-2" @click.stop="showAdd()" data-aid="agentstudio_create_new" :aria-label="i18n.agentStudioNewAgent" :title="i18n.agentStudioNewAgent">
            <v-icon>fa-plus</v-icon>
          </v-btn>
          <v-btn icon variant="flat" class="circle-button mx-2" @click.stop="loadData()" data-aid="agentstudio_refresh_button" :aria-label="i18n.ariaReloadData" :title="i18n.ariaReloadData">
            <v-icon>fa-sync</v-icon>
          </v-btn>
          <v-btn icon variant="flat" class="circle-button mx-2" :title="i18n.options" @click="showOptionsDialog = true" data-aid="agentstudio_options_button" :aria-label="i18n.options">
            <v-icon>fa-gear</v-icon>
          </v-btn>
          <v-btn icon variant="flat" class="circle-button mx-2" :target="$root.target('so-help')" :href="$root.parameters.docsUrl + 'onion-ai'" :title="i18n.contextualDocsBtn" data-aid="agentstudio_docs" :aria-label="i18n.contextualDocsBtn">
            <v-icon>fa-circle-question</v-icon>
          </v-btn>
        </v-toolbar>
      </div>

      <v-tabs-window v-model="tab">
        <!-- Agents tab -->
        <v-tabs-window-item value="agents">
          <v-row>
            <v-col id="agentstudio-agents" class="section-panel" data-aid="agentstudio_agents_section">
              <v-data-table :sort-by="sortByAgents" @update:sort-by="val => sortByAgents = val"
                :items-per-page-options="itemsPerPageOptions" v-model:items-per-page="itemsPerPage" must-sort :headers="agentHeaders" :items="agents" item-value="id" v-model:expanded="expandedAgents" data-aid="agentstudio_agents_table">
                <template #headers="{ columns, isSorted, getSortIcon, toggleSort }">
                  <tr>
                    <template v-for="header in columns" :key="header.key">
                      <th :class="{'is-sorted': isSorted(header)}" :data-aid="'agentstudio_agents_header_' + header?.value?.toLowerCase()" :aria-sort="isSorted(header) ? (getSortIcon(header) === '$sortAsc' ? 'ascending' : 'descending') : 'none'" scope="col">
                        <span @click="toggleSort(header)">{{ header.title }}</span>
                        <template v-if="isSorted(header)">
                          <v-icon>{{ getSortIcon(header) === '$sortAsc' ? 'fa-caret-up' : 'fa-caret-down' }}</v-icon>
                        </template>
                      </th>
                    </template>
                  </tr>
                </template>
                <template #item="{ item, isExpanded, toggleExpand, internalItem }">
                  <tr :class="{'seamless-expanded-row': isExpanded(internalItem), 'main-row': true}">
                    <td>
                      <v-btn icon variant="text" size="small" @click.stop="onToggleAgent(item, toggleExpand, internalItem)" :aria-expanded="isExpanded(internalItem)" :aria-label="i18n.agentStudioExpand" data-aid="agentstudio_agents_expand">
                        <v-icon v-if="isExpanded(internalItem)">fa-angle-down</v-icon>
                        <v-icon v-else>fa-angle-right</v-icon>
                      </v-btn>
                    </td>
                    <td>
                      {{ item.name }}
                    </td>
                    <td>
                      <v-chip v-if="item.isOrchestrator" size="small" color="primary" variant="tonal">{{ i18n.agentStudioOrchestrator }}</v-chip>
                      <span v-else>{{ i18n.agentStudioSpecialist }}</span>
                    </td>
                    <td>{{ item.model }}</td>
                    <td>
                      <v-chip v-for="s in item.allowedSkills" :key="s" size="small" variant="tonal" class="mr-1 my-1">{{ s }}</v-chip>
                      <span v-if="!item.allowedSkills.length" class="text-disabled">&mdash;</span>
                    </td>
                    <td>
                      <v-chip v-for="d in item.canDelegateTo" :key="d" size="small" variant="outlined" class="mr-1 my-1">{{ d }}</v-chip>
                      <span v-if="!item.canDelegateTo.length" class="text-disabled">&mdash;</span>
                    </td>
                  </tr>
                </template>
                <template #expanded-row="{ item }">
                  <tr class="expanded-row" data-aid="agentstudio_agents_expanded">
                    <td :colspan="agentHeaders.length" class="px-0">
                      <div class="expanded-row-wrapper pa-4">
                        <v-card variant="flat" class="agentstudio-editor">
                          <v-tabs v-model="agentTabs[item.id]" color="primary" density="comfortable" class="flex-grow-0" :data-aid="'agentstudio_agent_subtabs_' + item.id">
                            <v-tab value="identity"><v-icon class="mr-2">fa-id-card</v-icon>{{ i18n.agentStudioIdentity }}</v-tab>
                            <v-tab value="model"><v-icon class="mr-2">fa-microchip</v-icon>{{ i18n.agentStudioModel }}</v-tab>
                            <v-tab value="skills"><v-icon class="mr-2">fa-puzzle-piece</v-icon>{{ i18n.agentStudioSkills }}</v-tab>
                            <v-tab value="delegation"><v-icon class="mr-2">fa-sitemap</v-icon>{{ i18n.agentStudioDelegation }}</v-tab>
                            <v-tab value="persona"><v-icon class="mr-2">fa-masks-theater</v-icon>{{ i18n.agentStudioPersona }}</v-tab>
                            <v-tab value="memory"><v-icon class="mr-2">fa-brain</v-icon>{{ i18n.agentStudioMemory }}</v-tab>
                          </v-tabs>
                          <v-divider></v-divider>
                          <v-card-text>
                            <v-tabs-window v-model="agentTabs[item.id]">
                              <v-tabs-window-item value="identity">
                                <v-row>
                                  <v-col cols="12" md="6">
                                    <v-text-field v-model="draftFor(item).name" :label="i18n.agentStudioName" variant="outlined" density="comfortable" hide-details></v-text-field>
                                  </v-col>
                                  <v-col cols="12" md="6">
                                    <v-select v-model="draftFor(item).isOrchestrator" :items="roleItems" :label="i18n.agentStudioRole" variant="outlined" density="comfortable" hide-details></v-select>
                                  </v-col>
                                  <v-col cols="12">
                                    <v-textarea v-model="draftFor(item).description" :label="i18n.agentStudioDescription" variant="outlined" density="comfortable" rows="2" auto-grow :hint="i18n.agentStudioDescriptionHelp" persistent-hint></v-textarea>
                                  </v-col>
                                </v-row>
                              </v-tabs-window-item>

                              <v-tabs-window-item value="model">
                                <v-row>
                                  <v-col cols="12" md="6">
                                    <v-select v-model="draftFor(item).model" :items="models.map(m => m.displayName)" :label="i18n.agentStudioExecutingModel" variant="outlined" density="comfortable" :hint="i18n.agentStudioModelHelp" persistent-hint></v-select>
                                  </v-col>
                                </v-row>
                              </v-tabs-window-item>

                              <v-tabs-window-item value="skills">
                                <v-row>
                                  <v-col cols="12" md="8">
                                    <v-select v-model="draftFor(item).allowedSkills" :items="skills.map(s => s.name)" :label="i18n.agentStudioSkills" variant="outlined" density="comfortable" multiple chips closable-chips :hint="i18n.agentStudioSkillsHelp" persistent-hint></v-select>
                                  </v-col>
                                </v-row>
                              </v-tabs-window-item>

                              <v-tabs-window-item value="delegation">
                                <v-row>
                                  <v-col cols="12" md="8">
                                    <v-select v-model="draftFor(item).canDelegateTo" :items="delegateChoices(draftFor(item))" :label="i18n.agentStudioDelegatesTo" variant="outlined" density="comfortable" multiple chips closable-chips :hint="i18n.agentStudioDelegationHelp" persistent-hint></v-select>
                                  </v-col>
                                </v-row>
                              </v-tabs-window-item>

                              <v-tabs-window-item value="persona">
                                <v-row>
                                  <v-col cols="12">
                                    <v-textarea v-model="draftFor(item).prompt" :label="i18n.agentStudioPersona" variant="outlined" density="comfortable" rows="10" auto-grow :hint="i18n.agentStudioPersonaHelp" persistent-hint></v-textarea>
                                  </v-col>
                                </v-row>
                              </v-tabs-window-item>

                              <v-tabs-window-item value="memory">
                                <div class="text-center text-medium-emphasis py-8" data-aid="agentstudio_memory_empty">
                                  <v-icon size="32" class="mb-2">fa-brain</v-icon>
                                  <div>{{ i18n.agentStudioMemoryComingSoon }}</div>
                                </div>
                              </v-tabs-window-item>
                            </v-tabs-window>
                          </v-card-text>
                          <v-divider></v-divider>
                          <v-card-actions class="px-4">
                            <v-btn variant="text" color="error" :disabled="saving" @click.stop="removeAgent(item)" data-aid="agentstudio_agents_delete">{{ i18n.delete }}</v-btn>
                            <v-spacer></v-spacer>
                            <v-btn variant="flat" color="primary" :loading="saving" :disabled="!agentDirty(item)" @click.stop="saveAgent(item)" data-aid="agentstudio_agents_done">{{ i18n.save }}</v-btn>
                          </v-card-actions>
                        </v-card>
                      </div>
                    </td>
                  </tr>
                </template>
              </v-data-table>
            </v-col>
          </v-row>
        </v-tabs-window-item>

        <!-- Skills tab -->
        <v-tabs-window-item value="skills">
          <v-row>
            <v-col id="agentstudio-skills" class="section-panel" data-aid="agentstudio_skills_section">
              <v-data-table :sort-by="sortBySkills" @update:sort-by="val => sortBySkills = val"
                :items-per-page-options="itemsPerPageOptions" v-model:items-per-page="itemsPerPage" must-sort :headers="skillHeaders" :items="skills" item-value="id" v-model:expanded="expandedSkills" data-aid="agentstudio_skills_table">
                <template #headers="{ columns, isSorted, getSortIcon, toggleSort }">
                  <tr>
                    <template v-for="header in columns" :key="header.key">
                      <th :class="{'is-sorted': isSorted(header)}" :data-aid="'agentstudio_skills_header_' + header?.value?.toLowerCase()" :aria-sort="isSorted(header) ? (getSortIcon(header) === '$sortAsc' ? 'ascending' : 'descending') : 'none'" scope="col">
                        <span @click="toggleSort(header)">{{ header.title }}</span>
                        <template v-if="isSorted(header)">
                          <v-icon>{{ getSortIcon(header) === '$sortAsc' ? 'fa-caret-up' : 'fa-caret-down' }}</v-icon>
                        </template>
                      </th>
                    </template>
                  </tr>
                </template>
                <template #item="{ item, isExpanded, toggleExpand, internalItem }">
                  <tr :class="{'seamless-expanded-row': isExpanded(internalItem), 'main-row': true}">
                    <td>
                      <v-btn icon variant="text" size="small" @click.stop="toggleExpand(internalItem)" :aria-expanded="isExpanded(internalItem)" :aria-label="i18n.agentStudioExpand" data-aid="agentstudio_skills_expand">
                        <v-icon v-if="isExpanded(internalItem)">fa-angle-down</v-icon>
                        <v-icon v-else>fa-angle-right</v-icon>
                      </v-btn>
                    </td>
                    <td>
                      <v-icon class="mr-2 theme-icon">fa-puzzle-piece</v-icon>{{ item.name }}
                      <div class="text-body-small text-medium-emphasis">{{ item.description }}</div>
                    </td>
                    <td>
                      <v-chip v-for="t in item.tools" :key="t" size="small" variant="tonal" class="mr-1 my-1">{{ t }}</v-chip>
                    </td>
                    <td>
                      <v-chip v-for="a in skillUsedBy(item.name)" :key="a" size="small" variant="outlined" class="mr-1 my-1">{{ a }}</v-chip>
                      <span v-if="!skillUsedBy(item.name).length" class="text-disabled">&mdash;</span>
                    </td>
                  </tr>
                </template>
                <template #expanded-row="{ item }">
                  <tr class="expanded-row" data-aid="agentstudio_skills_expanded">
                    <td :colspan="skillHeaders.length" class="px-0">
                      <div class="expanded-row-wrapper pa-4">
                        <v-card variant="flat" class="agentstudio-editor">
                          <v-tabs v-model="skillTabs[item.id]" color="primary" density="comfortable" class="flex-grow-0" :data-aid="'agentstudio_skill_subtabs_' + item.id">
                            <v-tab value="tools"><v-icon class="mr-2">fa-screwdriver-wrench</v-icon>{{ i18n.agentStudioToolsUnlocked }}</v-tab>
                            <v-tab value="prompt"><v-icon class="mr-2">fa-file-lines</v-icon>{{ i18n.agentStudioPromptGuidance }}</v-tab>
                            <v-tab value="usage"><v-icon class="mr-2">fa-users</v-icon>{{ i18n.agentStudioUsedBy }}</v-tab>
                          </v-tabs>
                          <v-divider></v-divider>
                          <v-card-text>
                            <v-tabs-window v-model="skillTabs[item.id]">
                              <v-tabs-window-item value="tools">
                                <v-row>
                                  <v-col cols="12" md="8">
                                    <v-select v-model="item.tools" :items="item.tools" :label="i18n.agentStudioToolsUnlocked" variant="outlined" density="comfortable" multiple chips closable-chips></v-select>
                                  </v-col>
                                </v-row>
                              </v-tabs-window-item>

                              <v-tabs-window-item value="prompt">
                                <v-row>
                                  <v-col cols="12">
                                    <v-textarea v-model="item.additionalPrompt" :label="i18n.agentStudioPromptGuidance" variant="outlined" density="comfortable" rows="8" auto-grow></v-textarea>
                                  </v-col>
                                </v-row>
                              </v-tabs-window-item>

                              <v-tabs-window-item value="usage">
                                <div class="text-overline text-medium-emphasis">{{ i18n.agentStudioUsedBy }}</div>
                                <div>
                                  <v-chip v-for="a in skillUsedBy(item.name)" :key="a" size="small" variant="outlined" class="mr-1 my-1">{{ a }}</v-chip>
                                  <span v-if="!skillUsedBy(item.name).length" class="text-disabled">&mdash;</span>
                                </div>
                              </v-tabs-window-item>
                            </v-tabs-window>
                          </v-card-text>
                        </v-card>
                      </div>
                    </td>
                  </tr>
                </template>
              </v-data-table>
            </v-col>
          </v-row>
        </v-tabs-window-item>
      </v-tabs-window>
    </v-col>
  </v-row>
</v-container>
